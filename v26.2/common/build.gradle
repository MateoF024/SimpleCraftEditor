architectury {
    common(['fabric', 'neoforge'])
}

dependencies {
    // Fabric Loader is used here only for the @Environment annotations, which get remapped
    // to the correct annotations on each platform. Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "dev.architectury:architectury:${rootProject.architectury_api_v262}"

    // Recipe-viewer APIs for the integration code that lives in common. Compile-time only; the
    // same mezz.jei.api / me.shedaniel.rei.api classes ship in both loader jars, so the Fabric
    // ones are used here. Unobfuscated Minecraft needs no remapping, so these come in plain.
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/v26.2/fabric", include: 'jei-*.jar')
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/v26.2/fabric", include: 'RoughlyEnoughItems-*.jar')
}
