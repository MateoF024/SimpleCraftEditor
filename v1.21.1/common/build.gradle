architectury {
    common(['fabric', 'neoforge'])
}

dependencies {
    // Fabric Loader is used here only for the @Environment annotations, which get remapped
    // to the correct annotations on each platform. Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_v1211}"

    // Recipe-viewer APIs for the integration code that lives in common. Compile-time only; the same
    // mezz.jei.api / dev.emi.emi.api / me.shedaniel.rei.api classes ship in both loader jars, so the Fabric jars are used here.
    //
    // JEI is the exception, and deliberately: its NeoForge jar names Minecraft types the way this
    // module does, so it needs no remapping and goes in as a plain compileOnly. Taking the Fabric jar
    // instead would mean modCompileOnly, and that makes Loom refuse to configure the project the day
    // JEI is built with a Loom newer than ours — which happened at JEI 19.57.0.444. The API classes are
    // the same either way; only the namespace differs.
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/v1.21.1/neoforge", include: 'jei-*.jar')
    modCompileOnly fileTree(dir: "${rootProject.projectDir}/libs/v1.21.1/fabric", include: 'emi-*.jar')
    modCompileOnly fileTree(dir: "${rootProject.projectDir}/libs/v1.21.1/fabric", include: 'RoughlyEnoughItems-*.jar')
}
