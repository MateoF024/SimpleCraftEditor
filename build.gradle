plugins {
    id 'dev.architectury.loom' version '1.17.491' apply false
    // Minecraft stopped shipping obfuscated at 26.1, and Loom has a variant for that.
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// Java level per Minecraft generation: 1.20.x -> 17, 1.21.x -> 21, 26.x and newer -> 25.
def javaRelease = rootProject.minecraft_version.startsWith("1.20") ? 17
        : rootProject.minecraft_version.startsWith("1.21") ? 21
        : 25

// Everything before the 26.x naming scheme ships obfuscated and needs a mapping set. "1.20.1" and
// "1.21.11" start with "1."; "26.1.2" and "26.2" do not.
def obfuscated = rootProject.minecraft_version.startsWith("1.")

subprojects {
    apply plugin: obfuscated ? 'dev.architectury.loom' : 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Jars are named e.g. SimpleCraftEditor-fabric-1.20.1, keeping every version's output distinct.
        archivesName = "$rootProject.archives_name-$project.name-$rootProject.minecraft_version"
    }

    repositories {
        maven { url "https://maven.neoforged.net/releases/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // No mappings for 26.1 and newer: Mojang no longer publishes any, because there is nothing left
        // to map.
        if (obfuscated) {
            mappings loom.officialMojangMappings()
        }
    }

    java {
        def javaVer = JavaVersion.toVersion(javaRelease)
        sourceCompatibility = javaVer
        targetCompatibility = javaVer
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = javaRelease
    }

    // Ship the license inside every jar. The mod is all-rights-reserved with specific permissions
    // granted, so the terms have to travel with the binary — a jar pulled out of a modpack is often the
    // only copy anyone ever sees, and the manifests point at this file by name. Named after the mod id so
    // it cannot collide with another license when jars are nested.
    tasks.named('jar', Jar).configure {
        from(rootProject.file('LICENSE.txt')) {
            rename { 'LICENSE-sce.txt' }
        }
    }

    afterEvaluate {
        // Collect the final, remapped loader jars under the root build/libs directory.
        tasks.withType(AbstractArchiveTask).configureEach {
            if (project.name != 'common'
                    && !name.toLowerCase().contains('source')
                    && !archiveClassifier.getOrElse('').toLowerCase().contains('dev')) {
                destinationDirectory = rootProject.layout.buildDirectory.dir("libs")
            }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // Add repositories to publish to here.
        }
    }
}
