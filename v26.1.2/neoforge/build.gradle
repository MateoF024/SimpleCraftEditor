plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version_v2612"
    implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_v2612}"

    // Recipe-viewer APIs we integrate with, from the local, gitignored libs/ tree.
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/v26.1.2/neoforge", include: 'jei-*.jar')
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/v26.1.2/neoforge", include: 'RoughlyEnoughItems-*.jar')

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

// Unobfuscated Minecraft needs no remapping, so the shadow jar is the final artifact directly. The
// plain jar is an intermediate: the 'dev' classifier keeps it out of the distributable output folder.
jar {
    archiveClassifier = 'dev-raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

assemble.dependsOn shadowJar
