architectury {
    common(['fabric', 'neoforge'])
}

dependencies {
    // Fabric Loader is used here only for the @Environment annotations, which get remapped
    // to the correct annotations on each platform. Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_v12111}"

    // Recipe-viewer APIs for the integration code that lives in common. Compile-time only; the same
    // mezz.jei.api / me.shedaniel.rei.api classes ship in both loader jars, so the Fabric jars are used
    // here. EMI has no build for this version, so its integration does not come along.
    modCompileOnly fileTree(dir: "${rootProject.projectDir}/libs/v1.21.11/fabric", include: 'jei-*.jar')
    modCompileOnly fileTree(dir: "${rootProject.projectDir}/libs/v1.21.11/fabric", include: 'RoughlyEnoughItems-*.jar')
}
