plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_v263}"
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_v263}"

    // Recipe-viewer APIs we integrate with, from the local, gitignored libs/ tree.
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/v26.3/fabric", include: 'jei-*.jar')
    compileOnly fileTree(dir: "${rootProject.projectDir}/libs/v26.3/fabric", include: 'FarmersDelight-*.jar')

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

// Unobfuscated Minecraft needs no remapping, so the shadow jar is the final artifact directly. The
// plain jar is an intermediate: the 'dev' classifier keeps it out of the distributable output folder.
jar {
    archiveClassifier = 'dev-raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

assemble.dependsOn shadowJar
